##################SidewinderX2 Klipper Config - 3DPrintBeginner###################
#Full guide: https://3dprintbeginner.com/how-to-install-klipper-on-sidewinder-x2/#
[virtual_sdcard]
path: ~/printer_data/gcodes

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f401xc_4A0011001550435436313420-if00
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 7500
#max_accel_to_decel: 7500
max_z_velocity: 50
max_z_accel: 100
square_corner_velocity: 10.0
minimum_cruise_ratio: 0.5

[stepper_x]
step_pin: !PB14
dir_pin: PB13
enable_pin: !PB15
full_steps_per_rotation:200
microsteps: 16
rotation_distance: 40
endstop_pin: !PA2
position_endstop: 0
position_max: 228
homing_speed: 50
#max_accel: 7500
#max_velocity: 500 


[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB12
full_steps_per_rotation:200
microsteps: 16
rotation_distance: 40
endstop_pin: !PA1
position_endstop: 0
position_max: 220
homing_speed: 50
#max_accel: 7500
#max_velocity: 500 


[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 32
rotation_distance: 16
endstop_pin: probe:z_virtual_endstop
position_max: 240
position_min: -5
#max_accel: 100
#max_velocity: 50 



[extruder]
step_pin: PA7
dir_pin: PA6
enable_pin: !PC4
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC0
  #rotation_distance: 7.1910 #OG
rotation_distance: 7.40673
filament_diameter: 1.750
nozzle_diameter: 0.400
microsteps: 16
#microsteps:64
min_temp: 0
max_temp: 250
max_extrude_only_distance: 100.0
max_extrude_cross_section: 50.0
pressure_advance: 0.065
#max_accel: 5000
#max_velocity: 25 

#control: pid
#pid_Kp: 23.223
#pid_Ki: 1.518
#pid_Kd: 88.826



[neopixel extruder]
pin: PB7
initial_RED: 1.0
initial_GREEN: 0.35
initial_BLUE: 0

[heater_bed]
heater_pin: PA8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC1
#control: pid
#pid_Kp: 23.223
#pid_Ki: 1.518
#pid_Kd: 88.826
min_temp: 0
max_temp: 130

[fan]
off_below:0.1
pin: PC8

[heater_fan hotend_fan]
pin: PC7
heater: extruder
heater_temp: 50.0

[controller_fan stepper_fan]
pin: PC6
idle_timeout: 300

[bltouch]
sensor_pin: PC2 
control_pin: PC3 
x_offset:27.25
y_offset:-12.8
#z_offset: 0.25
speed:10
samples:1
samples_result:average

[include start.cfg]

[include end.cfg]

[include macros.cfg]

[exclude_object]

[input_shaper]
shaper_freq_x: 36.92
shaper_freq_y: 42.85
shaper_type: mzv


[bed_mesh]
speed: 100
mesh_min: 30, 20
mesh_max: 210, 200
algorithm: bicubic
probe_count: 6,6

[safe_z_home]
#home_xy_position: 0,220
home_xy_position: 110,110
speed: 100
z_hop: 10
z_hop_speed: 5


[display_status]

[idle_timeout]
timeout: 90000

[pause_resume]

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 2.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE

